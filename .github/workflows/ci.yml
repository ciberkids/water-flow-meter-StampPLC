name: CI

# Every gate this project relies on, run on every push. None of it is new — it is the
# same set that has been run by hand all along, which is exactly the problem: the
# firmware once went months without compiling because nothing checked.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web + exporter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/mockup
    steps:
      - uses: actions/checkout@v4

      # Pinned to match the development environment. CI previously ran Node 20 while
      # local was 22, which hid a real bug: `node --test "glob"` only expands globs from
      # Node 21, so the exporter suite passed locally and could not find its tests on CI.
      # The script now relies on shell expansion instead, but matching versions is what
      # stops the next such divergence.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/mockup/package-lock.json

      # `npm ci` installs exactly the lockfile, so CI and a fresh clone agree. This was
      # `npm install` while node_modules was tracked in git (decision F1) — and the tracked
      # copy had no vitest, so a fresh clone could not run the tests at all.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Exporter tests
        run: npm run test:exporter

      - name: Build
        run: npm run build

      # THE VISUAL SUITE'S ASSERTIONS, which is the half of it that caught real breakage (DF21).
      #
      # It went unrun for months and was failing 32 of 46 tests when someone finally looked (DF17). Eleven
      # of those failures were assertions about the workspace's own controls - a clamp that expected
      # portrait bounds, a button renamed to an indicator, a panel moved to another tab - and not one was a
      # moved baseline. That is the part worth gating, and it is what this step gates.
      #
      # --ignore-snapshots, deliberately. The committed baselines are `chromium-linux` generated on the
      # maintainer's Fedora host; text rendering is not identical across distributions, so comparing pixels
      # here would fail on fonts rather than on regressions and the first fix would be to delete the
      # comparison. Pixel comparison therefore stays a LOCAL gate (`npm run test:visual`) until baselines
      # are generated in this image, which is its own decision. Everything else runs: the 44 workspace
      # assertions, the three banner cases including the band's geometry at y=116, and the four
      # accessibility passes.
      #
      # Cost: about a minute of assertions plus the browser download, against a suite that hid 32 failures.
      - name: Install the browser the visual suite drives
        run: npx playwright install --with-deps chromium

      - name: Visual suite assertions (snapshots compared locally, not here)
        run: npx playwright test --ignore-snapshots

      # --allow-missing-toolchain because the firmware compile is the other job's
      # responsibility. Without the flag this correctly refuses to export unverified
      # output, which is the behaviour we want locally and on a release runner.
      - name: Export gates
        run: npm run export:firmware -- --allow-missing-toolchain

      # The skeleton generator produces the checked-in dataset, and it is idempotent against
      # it. Running it and diffing catches the generator rotting silently — which it just
      # did: manifest format 3 renamed `enum` to `options`, and the generator went on reading
      # the old field, so the baud-rate editor would have shown "0 to 7" instead of the baud
      # list. Nothing noticed, because nothing ran the generator.
      - name: Fail if the skeleton generator no longer reproduces the dataset
        run: |
          # --write, WITHOUT WHICH THIS GATE CANNOT FAIL. The generator prints its summary and writes
          # nothing unless asked, so the diff below was always empty and the check had been passing
          # unconditionally — including across the several dataset changes made since it was added.
          node tools/skeleton/generate.mjs --write
          cd "$GITHUB_WORKSPACE"
          if ! git diff --quiet -- web/mockup/src/data/screens.json; then
            echo "::error::tools/skeleton/generate.mjs no longer reproduces src/data/screens.json."
            echo "Either the generator has rotted, or the dataset was hand-edited without"
            echo "updating it. Both need a human decision."
            git --no-pager diff --stat -- web/mockup/src/data/screens.json
            exit 1
          fi

      # Catches a dataset edited without re-exporting, which would otherwise ship a UI
      # that does not match its source. The ISO timestamp is ignored because the export
      # embeds a wall-clock time: two exports of identical input differ only by that, so
      # an unfiltered diff would fail on every run. Verified that the filter still
      # catches a genuine content change.
      - name: Fail if the committed assets do not match a fresh export
        run: |
          cd "$GITHUB_WORKSPACE"
          TS='[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}'
          if ! git diff --quiet -I"$TS" -- Water-Flow-Meter-PlatformIO/src/ui/generated; then
            echo "::error::The committed generated assets do not match a fresh export."
            echo "Run 'npm run export:firmware' in web/mockup and commit the result."
            git --no-pager diff -I"$TS" --stat -- Water-Flow-Meter-PlatformIO/src/ui/generated
            exit 1
          fi

  # ── Generated documentation ────────────────────────────────────────────────────────────
  #
  # Three artefacts are generated from code and were, until now, generated by hand when
  # somebody remembered: the Modbus register reference (from the two register headers), the
  # navigation diagrams (from the screen dataset), and the wiki itself. Every one of them had
  # already gone stale at least once — the diagrams drew a menu structure two restructures old
  # and nothing reported it, because a document has no test.
  #
  # So the gates run on every push and the publish runs on main. The gates are the valuable
  # half: they fail when the docs stop describing the code, which is the moment worth catching.
  docs:
    name: Generated docs
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the wiki is a git repository, written with the same token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Reconciliation, in both directions: a register the headers declare and the generator does
      # not describe fails here, and so does a description for a register that no longer exists.
      # An integrator decodes real hardware against this table, and a wrong address does not fail
      # loudly — it returns a plausible number from the wrong field.
      - name: The register reference agrees with the firmware headers
        run: node tools/wiki/gen-registers.mjs > /dev/null

      # The diagrams are committed, so drift is a diff: the generator overwrites them from the
      # dataset and anything left over means the committed copy was not regenerated. This is the
      # check the retired ui_state_machine.mermaid needed for the months it spent describing
      # P1..P7 after the pages were renumbered P0..P6.
      - name: The committed diagrams match a fresh generation
        run: |
          node tools/wiki/gen-diagrams.mjs --write
          if ! git diff --quiet -- docs/diagrams; then
            echo "::error::docs/diagrams is stale. Run 'node tools/wiki/gen-diagrams.mjs --write' and commit."
            git --no-pager diff --stat -- docs/diagrams
            exit 1
          fi

      # Same shape as the freshness check above, for a sharper reason. The hand-written table this
      # replaced listed 4 of 19 actions, and two of the four - ui.action.mode.configuration and
      # ui.action.mode.info - had been replaced by the nav.* actions and no longer existed. Omitting
      # fifteen makes them look unavailable; advertising two that no handler implements sends an
      # implementer to wire a flow the firmware will refuse.
      - name: The action table matches the firmware catalogue
        run: |
          node tools/wiki/gen-actions.mjs --write
          if ! git diff --quiet -- "docs/Requirements/feature addition/UI_Firmware_Interface.md"; then
            echo "::error::The action table is stale. Run 'node tools/wiki/gen-actions.mjs --write' and commit."
            git --no-pager diff -- "docs/Requirements/feature addition/UI_Firmware_Interface.md"
            exit 1
          fi

      # I2 — the value and action catalogue is APPEND-ONLY, and this is what makes that more than
      # prose. NOT the same check as the manifest freshness gate in the host-tests job: that one
      # enforces that the committed manifest matches a fresh generation, so a rename plus a regenerate
      # agrees with itself and sails through. A rule about history needs a record of history.
      - name: The catalogue ledger accepts only appends
        run: node tools/catalogue/check-ledger.mjs

      # Diagram VALIDITY, which is a different property from the freshness check above and needs its
      # own gate. Four diagrams shipped in the commit that added the freshness check and not one of
      # them rendered: each carried a bare `%%` separator, which mermaid does not treat as a comment,
      # so GitHub showed an error where the picture should be. The freshness gate passed throughout —
      # correctly, because the generator was faithfully producing something invalid.
      - name: Install the documentation gate's dependencies
        run: npm ci --no-audit --no-fund --prefix tools/wiki

      - name: Every diagram will actually render
        run: node tools/wiki/check-diagrams.mjs

      # Dry run: builds every page and refuses if any repository path a page cites has moved.
      # A wiki page pointing at a renamed file is how a reader decides the docs are stale and
      # stops trusting the rest of them.
      - name: Every wiki pointer resolves
        run: bash tools/wiki/sync.sh

      # Only from main, and only on a push — a pull request from a fork must not be able to
      # rewrite the wiki, and a feature branch's docs are not the published ones.
      - name: Publish the wiki
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          WIKI_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
          WIKI_AUTHOR_NAME: github-actions[bot]
          WIKI_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash tools/wiki/sync.sh --push

  firmware-host:
    name: Firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain needed: the navigator, the acceleration tiers and the LED patterns
      # are deliberately Arduino-free so they can be checked in a second.
      #
      # This job also verifies that the committed manifest matches a fresh generation from
      # the firmware catalogues (decision D2). That is what keeps the design tool's idea of
      # the firmware's vocabulary honest — the manifest used to be hand-maintained, and it
      # advertised eight actions with no handler and omitted registers the firmware
      # published.
      - name: Host tests and manifest freshness
        run: Water-Flow-Meter-PlatformIO/test/host/run.sh

  firmware-build:
    name: Firmware compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Water-Flow-Meter-PlatformIO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('Water-Flow-Meter-PlatformIO/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # The gate that matters most. The generated UI header once could not compile at
      # all, and the export reported success anyway.
      - name: Compile
        run: pio run -e m5stack-stamplc
