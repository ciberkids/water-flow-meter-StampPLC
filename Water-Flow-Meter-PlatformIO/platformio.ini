; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-stamplc]
platform = espressif32
board = esp32-s3-devkitc-1
; Arduino, not espidf: every source here uses setup()/loop(), M5StamPLC.h,
; Preferences.h and HardwareSerial. Nothing in src/ touches an IDF-only API.
framework = arduino
upload_speed = 1500000
; Sandbox spikes are prototypes with their own main(); never compile them.
build_src_filter =
	+<*>
	-<ui/sandbox/>
; The Arduino core defaults project sources to gnu++11, but src/ uses C++17
; throughout: std::string_view (theme_palette, ui_bindings), inline constexpr
; variables (register_map.h) and std::clamp (led_controller).
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-DESP32S3
	-DCORE_DEBUG_LEVEL=5
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	; Move the WiFi task off core 0, which Project_document §3.2 reserves for pulse
	; polling (WiFi_MQTT_Connectivity.md §2.1.3, R2.1.0).
	;
	; The shipped sdkconfig.h:417 defines CONFIG_ESP32_WIFI_TASK_PINNED_TO_CORE_0 and
	; leaves _CORE_1 undefined, and esp_wifi.h tests `#if
	; CONFIG_ESP32_WIFI_TASK_PINNED_TO_CORE_1` — so WIFI_TASK_CORE_ID resolves to 0,
	; putting a priority-23 task on the polling core. Defining _CORE_1 flips it.
	;
	; This reaches the running system because the core id is a RUNTIME field:
	; WIFI_INIT_CONFIG_DEFAULT() sets .wifi_task_core_id = WIFI_TASK_CORE_ID, and it
	; expands in WiFiGeneric.cpp:672 — which PlatformIO compiles from source, not from
	; a prebuilt archive. (lwIP's task core is NOT reachable this way; it is a literal
	; inside liblwip.a. See §2.1.3 for what that residual costs.)
	;
	; Inert until the first WiFi.begin(); added now because it is the one line the
	; measurement invariant depends on and it is verified.
	-DCONFIG_ESP32_WIFI_TASK_PINNED_TO_CORE_1=1
; PINNED TO COMMITS, deliberately, after an upstream change broke CI on 2026-08-26.
;
; Both of these were bare git URLs, so every build resolved whatever was on the default branch that
; day. `main` was green on 2026-08-25 and a DOCS-ONLY pull request failed to compile on 2026-08-26 with
; no repository change in between: M5Unified had changed `IOExpander_Base::setPullMode`'s second
; parameter from `bool` to a `gpio_pull_t` enum, and `m5stack/M5StamPLC@^1.1.0` still calls it with a
; bool. Nothing in this project can fix that — the two libraries are simply out of step upstream — and
; nothing here could have predicted it either, which is the argument for a pin rather than for a
; workaround.
;
; AND PINNING THE TWO EXPOSED SOMETHING LARGER: the local container and CI were building DIFFERENT
; dependency sets, and had been for as long as the container existed. Clearing `.pio/libdeps` and
; re-resolving moved M5StamPLC 1.1.0 -> 1.2.0 (`^1.1.0` permits it) and M5GFX 0.2.17 -> 0.2.28, which is
; why Flash went 38.1% -> 39.0% with no source change. Every size figure recorded in this repository
; before 2026-08-26 came from the container's stale set; CI was compiling something else and agreeing by
; luck. So all four are pinned exactly, and M5StamPLC is pinned to 1.2.0 rather than 1.1.0 because that
; is the version the code is written for — G1 in the open register records that 1.2.0 removed the bulk
; `IO.getDigitalInput()`, which is why the sampler reads the expander per channel.
;
; A local build did NOT catch the upstream break, and the reason is worth knowing: the podman image
; caches `.pio/libdeps`, so it kept resolving the good commits long after CI stopped. **A green
; container build is not evidence about dependency resolution.** Clear `.pio/libdeps` before trusting a
; compile to say anything about dependencies.
;
; To move a version deliberately: change the ref, clear `.pio/libdeps`, compile, and read the size
; numbers — they are the cheapest signal that an upstream change did something unexpected.
lib_deps =
	M5Unified=https://github.com/m5stack/M5Unified#5580ff6923a868cc71d5b30c962186bde2c85b67
	m5stack/M5StamPLC@1.2.0
	m5stack/M5GFX@0.2.28
	eModbus=https://github.com/eModbus/eModbus#6e4200d1a5213cf3004d60855c880604391f50af
