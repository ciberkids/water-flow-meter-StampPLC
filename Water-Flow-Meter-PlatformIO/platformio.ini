; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-stamplc]
platform = espressif32
board = esp32-s3-devkitc-1
; Arduino, not espidf: every source here uses setup()/loop(), M5StamPLC.h,
; Preferences.h and HardwareSerial. Nothing in src/ touches an IDF-only API.
framework = arduino
upload_speed = 1500000
; Sandbox spikes are prototypes with their own main(); never compile them.
build_src_filter =
	+<*>
	-<ui/sandbox/>
; The Arduino core defaults project sources to gnu++11, but src/ uses C++17
; throughout: std::string_view (theme_palette, ui_bindings), inline constexpr
; variables (register_map.h) and std::clamp (led_controller).
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-DESP32S3
	-DCORE_DEBUG_LEVEL=5
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	; Move the WiFi task off core 0, which Project_document §3.2 reserves for pulse
	; polling (WiFi_MQTT_Connectivity.md §2.1.3, R2.1.0).
	;
	; The shipped sdkconfig.h:417 defines CONFIG_ESP32_WIFI_TASK_PINNED_TO_CORE_0 and
	; leaves _CORE_1 undefined, and esp_wifi.h tests `#if
	; CONFIG_ESP32_WIFI_TASK_PINNED_TO_CORE_1` — so WIFI_TASK_CORE_ID resolves to 0,
	; putting a priority-23 task on the polling core. Defining _CORE_1 flips it.
	;
	; This reaches the running system because the core id is a RUNTIME field:
	; WIFI_INIT_CONFIG_DEFAULT() sets .wifi_task_core_id = WIFI_TASK_CORE_ID, and it
	; expands in WiFiGeneric.cpp:672 — which PlatformIO compiles from source, not from
	; a prebuilt archive. (lwIP's task core is NOT reachable this way; it is a literal
	; inside liblwip.a. See §2.1.3 for what that residual costs.)
	;
	; Inert until the first WiFi.begin(); added now because it is the one line the
	; measurement invariant depends on and it is verified.
	-DCONFIG_ESP32_WIFI_TASK_PINNED_TO_CORE_1=1
lib_deps =
	M5Unified=https://github.com/m5stack/M5Unified
	m5stack/M5StamPLC@^1.1.0
	eModbus=https://github.com/eModbus/eModbus
