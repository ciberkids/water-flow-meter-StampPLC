; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-stamplc]
platform = espressif32
board = esp32-s3-devkitc-1
; Arduino, not espidf: every source here uses setup()/loop(), M5StamPLC.h,
; Preferences.h and HardwareSerial. Nothing in src/ touches an IDF-only API.
framework = arduino
upload_speed = 1500000
; Sandbox spikes are prototypes with their own main(); never compile them.
build_src_filter =
	+<*>
	-<ui/sandbox/>
; The Arduino core defaults project sources to gnu++11, but src/ uses C++17
; throughout: std::string_view (theme_palette, ui_bindings), inline constexpr
; variables (register_map.h) and std::clamp (led_controller).
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-DESP32S3
	-DCORE_DEBUG_LEVEL=5
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	M5Unified=https://github.com/m5stack/M5Unified
	m5stack/M5StamPLC@^1.1.0
	eModbus=https://github.com/eModbus/eModbus
